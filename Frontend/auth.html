<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - Forum des Pattes</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <h1>🐾 Rejoins la Meute !</h1>
      <nav><a href="/">Retour à l'accueil</a></nav>
    </header>

    <main>
      <section>
        <h2>Se connecter</h2>
        <form id="login-form">
          <label>Pseudo ou Email :</label><br />
          <input type="text" id="log-identifier" required /><br /><br />
          <label>Mot de passe :</label><br />
          <input type="password" id="log-password" required /><br /><br />
          <button type="submit">Se connecter</button>
        </form>
        <p id="login-message"></p>
      </section>

      <hr />

      <section>
        <h2>Créer un compte</h2>
        <form id="register-form">
          <label>Pseudo :</label><br />
          <input type="text" id="reg-username" required /><br /><br />
          <label>Email :</label><br />
          <input type="email" id="reg-email" required /><br /><br />
          <label>Mot de passe :</label><br />
          <input type="password" id="reg-password" required /><br />
          <small
            ><i>(8 caractères min, 1 majuscule, 1 caractère spécial)</i></small
          ><br /><br />
          <button type="submit">S'inscrire</button>
        </form>
        <p id="register-message"></p>
      </section>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
