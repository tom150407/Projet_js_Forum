<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum des Pattes - Accueil</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>🐾 Le Forum des Pattes</h1>
      <nav><a href="/auth.html">Connexion / Inscription</a></nav>
    </header>

    <main>
      <div
        id="user-info"
        style="margin-bottom: 20px; padding: 10px; background-color: #f0f0f0"
      ></div>

      <section
        id="create-topic-section"
        style="
          display: none;
          border: 2px dashed #ccc;
          padding: 15px;
          margin-bottom: 20px;
        "
      >
        <h3>📝 Lancer une nouvelle discussion</h3>
        <form id="create-topic-form">
          <label>Catégorie (Tag) :</label><br />
          <select id="topic-category" required>
            <option value="" disabled selected>
              Choisis un type de patte...
            </option></select
          ><br /><br />
          <label>Titre :</label><br />
          <input
            type="text"
            id="topic-title"
            style="width: 100%"
            required
          /><br /><br />
          <label>Contenu :</label><br />
          <textarea
            id="topic-content"
            rows="4"
            style="width: 100%"
            required
          ></textarea
          ><br /><br />
          <button type="submit">Poster 🐾</button>
        </form>
        <p id="topic-message"></p>
      </section>

      <h2>Dernières discussions</h2>

      <div
        style="
          margin-bottom: 15px;
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
          align-items: center;
          background: #f5f5f5;
          padding: 10px;
          border-radius: 5px;
        "
      >
        <div>
          🔍
          <input
            type="text"
            id="search-input"
            placeholder="Chercher un titre ou tag..."
            oninput="
              currentPage = 1;
              loadTopics();
            "
            style="padding: 5px; width: 200px"
          />
        </div>
        <div>
          Catégorie :
          <select
            id="tag-filter"
            onchange="
              currentPage = 1;
              loadTopics();
            "
          >
            <option value="all">Toutes</option>
          </select>
        </div>
        <div>
          Afficher :
          <select
            id="topic-limit"
            onchange="
              currentPage = 1;
              loadTopics();
            "
          >
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="all">Tous</option>
          </select>
        </div>
      </div>

      <div id="topics-container">
        <p><i>Chargement...</i></p>
      </div>

      <div id="pagination-controls" style="margin-top: 15px">
        <button onclick="changePage(-1)">Précédent</button>
        <span id="current-page" style="margin: 0 10px; font-weight: bold"
          >Page 1</span
        >
        <button onclick="changePage(1)">Suivant</button>
      </div>
    </main>

    <script src="/js/home.js"></script>
  </body>
</html>
